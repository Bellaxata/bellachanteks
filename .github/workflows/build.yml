name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
      obfuscate_so:
        description: "Amankan URL (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip
          ls -lh project.zip

      - name: Extract ZIP
        run: |
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "File bukan ZIP valid!"
            exit 1
          fi
          unzip -q project.zip -d project_raw

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # ═══════════════════════════════════════════════════════════════════════
      # AMANKAN LINK — Full Node.js (Anti-Error)
      # ═══════════════════════════════════════════════════════════════════════
      - name: Amankan Link
        if: ${{ github.event.inputs.obfuscate_so == 'true' }}
        run: |
          echo "=== AMANKAN LINK ==="
          cat > protect-link.js << 'PROTECT_SCRIPT'
          const fs = require("fs");
          const path = require("path");

          // Regex URL di dalam string quotes (single/double)
          const URL_REGEX = /(["'])(https?:\/\/[^\s"'<>\\]+?|wss?:\/\/[^\s"'<>\\]+?|ftps?:\/\/[^\s"'<>\\]+?)\1/g;

          function splitUrl(url) {
            const len = url.length;
            if (len < 6) return null;
            const p1len = Math.ceil(len / 3);
            const p2len = Math.ceil((len - p1len) / 2);
            const p1 = url.substring(0, p1len);
            const p2 = url.substring(p1len, p1len + p2len);
            const p3 = url.substring(p1len + p2len);
            return [p1, p2, p3].filter(x => x.length > 0);
          }

          function walkDir(dir, results) {
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            for (const entry of entries) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (["build", ".dart_tool", ".git", ".idea", "android", "ios", "linux", "macos", "windows", "web", ".vscode"].includes(entry.name)) continue;
                walkDir(fullPath, results);
              } else if (entry.isFile() && entry.name.endsWith(".dart")) {
                results.push(fullPath);
              }
            }
          }

          const projectDir = process.argv[2];
          const libDir = path.join(projectDir, "lib");

          if (!fs.existsSync(libDir)) {
            console.log("[PROTECT] Tidak ada folder lib/, skip");
            process.exit(0);
          }

          const dartFiles = [];
          walkDir(libDir, dartFiles);

          let counter = 0;
          const urlMap = {};

          // PASS 1: Ganti URL jadi marker XSPLITX__vNXENDX (di semua file .dart)
          for (const file of dartFiles) {
            try {
              let content = fs.readFileSync(file, "utf8");
              const before = content;

              content = content.replace(URL_REGEX, (match, quote, url) => {
                const parts = splitUrl(url);
                if (!parts) return match;

                const id = counter++;
                const varName = "__v" + id;
                urlMap[varName] = parts;

                return "XSPLITX" + varName + "XENDX";
              });

              if (content !== before) {
                fs.writeFileSync(file, content, "utf8");
              }
            } catch (e) {
              console.log("[PROTECT] Pass1 error " + file + ": " + e.message);
            }
          }

          // Buat file link_resolver.dart di lib/
          const helperLines = [];
          helperLines.push("// Auto-generated - URL resolver");
          helperLines.push("// Created by XATANICVXII Protect System");
          helperLines.push("");
          helperLines.push("const Map<String, List<String>> _linkParts = {");
          for (const [name, parts] of Object.entries(urlMap)) {
            const partsStr = parts.map(p => JSON.stringify(p)).join(", ");
            helperLines.push("  " + JSON.stringify(name) + ": [" + partsStr + "],");
          }
          helperLines.push("};");
          helperLines.push("");
          helperLines.push("String __resolve(String name) {");
          helperLines.push("  final parts = _linkParts[name];");
          helperLines.push("  if (parts == null) return '';");
          helperLines.push("  return parts.join('');");
          helperLines.push("}");
          helperLines.push("");
          helperLines.push("/// Universal URL resolver");
          helperLines.push("String u(String name) => __resolve(name);");

          const resolverPath = path.join(libDir, "link_resolver.dart");
          fs.writeFileSync(resolverPath, helperLines.join("\n"), "utf8");

          // PASS 2: Ganti marker jadi u('__vN') + inject import relative path
          for (const file of dartFiles) {
            try {
              // Skip file resolver
              if (path.resolve(file) === path.resolve(resolverPath)) continue;

              let content = fs.readFileSync(file, "utf8");
              if (!content.includes("XSPLITX")) continue;

              // Replace marker jadi u('__vN')
              content = content.replace(/XSPLITX([a-zA-Z0-9_]+)XENDX/g, (_, name) => {
                return "u('" + name + "')";
              });

              // Hitung relative path ke link_resolver.dart dari file ini
              const fileDir = path.dirname(file);
              let relPath = path.relative(fileDir, resolverPath);
              relPath = relPath.split(path.sep).join("/");
              if (!relPath.startsWith(".")) relPath = "./" + relPath;

              const importLine = "import '" + relPath + "';";

              // Hapus semua import link_resolver lama (jaga-jaga)
              content = content.replace(/^imports+['"][^'"]*link_resolver.dart['"];s*$/gm, "");

              // Bersihkan newline ganda
              content = content.replace(/


+/g, "

");

              // Inject import baru di atas import pertama
              const importRegex = /^imports+.*?;$/m;
              if (importRegex.test(content)) {
                content = content.replace(importRegex, (m) => m + "
" + importLine);
              } else {
                content = importLine + "
" + content;
              }

              fs.writeFileSync(file, content, "utf8");
            } catch (e) {
              console.log("[PROTECT] Pass2 error " + file + ": " + e.message);
            }
          }

          console.log("[PROTECT] Done. URLs protected: " + Object.keys(urlMap).length);
          console.log("[PROTECT] Dart files scanned: " + dartFiles.length);
          PROTECT_SCRIPT

          node protect-link.js "$PROJECT_DIR"

          echo "=== Verify ==="
          if [ -f "$PROJECT_DIR/lib/link_resolver.dart" ]; then
            echo "✅ link_resolver.dart created"
            head -10 "$PROJECT_DIR/lib/link_resolver.dart"
          else
            echo "❌ link_resolver.dart NOT created"
            exit 1
          fi

          echo ""
          echo "=== Sample replaced file ==="
          find "$PROJECT_DIR/lib" -name "*.dart" -type f -exec grep -l "u('__v" {} \; | head -1 | xargs -I{} sh -c 'echo "File: {}"; head -5 "{}"'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          else
            echo "[RESULT_ANALYZE]"
            echo "pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 1

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            timeout 120s flutter pub get || echo "Lanjut..."
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter build apk --${{ github.event.inputs.build_type }}
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR" && chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug
            else
              ./gradlew assembleRelease
            fi
          fi

      - name: Check APK Output
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error