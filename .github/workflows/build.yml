name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip
          file project.zip

      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            cat project.zip
            exit 1
          fi
          echo "✅ ZIP valid"

          echo "=== Extracting ==="
          unzip -q project.zip -d project_raw

          echo "=== Struktur project_raw ==="
          ls -la project_raw/
          echo ""
          
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Locked PROJECT_DIR: $PROJECT_DIR"
          
          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "❌ pubspec.yaml TIDAK DITEMUKAN di $PROJECT_DIR!"
            echo "=== Isi folder $PROJECT_DIR ==="
            ls -la "$PROJECT_DIR/"
            echo ""
            echo "=== Cari pubspec.yaml di mana saja ==="
            find project_raw -name "pubspec.yaml"
            exit 1
          fi
          echo "✅ pubspec.yaml ditemukan"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Verify Project Structure
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Current DIR ==="
          pwd
          echo ""
          echo "=== Files in project ==="
          ls -la
          echo ""
          echo "=== Check Android folder ==="
          if [ -d "android" ]; then
            echo "✅ Folder android ADA"
            ls -la android/ | head -20
            if [ -f "android/gradlew" ]; then
              echo "✅ gradlew ADA"
            else
              echo "⚠️ gradlew TIDAK ADA (akan di-fix nanti)"
            fi
          else
            echo "⚠️ Folder android TIDAK ADA (akan di-generate nanti)"
          fi

      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze > analyze_report.txt 2>&1 || true
          echo "[RESULT_ANALYZE]"
          cat analyze_report.txt
          echo "[END_RESULT_ANALYZE]"
          rm -f analyze_report.txt

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 1

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          timeout 180s flutter pub get || echo "⚠️ Pub get timeout, lanjut..."
          echo "=== Pub get done ==="

      - name: Ensure Android Folder Exists
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d "android" ]; then
            echo "⚠️ Folder android TIDAK ADA, membuat ulang..."
            flutter create --platforms=android .
            echo "✅ Folder android berhasil dibuat"
          else
            echo "✅ Folder android sudah ada"
          fi
          
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "✅ gradlew sudah executable"
          else
            echo "⚠️ gradlew masih tidak ada, coba regenerate..."
            cd android 2>/dev/null && gradle wrapper 2>/dev/null || echo "skip gradle wrapper"
            cd ..
            if [ -f "android/gradlew" ]; then
              chmod +x android/gradlew
              echo "✅ gradlew berhasil dibuat"
            fi
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Building APK (type: ${{ github.event.inputs.build_type }}) ==="
          
          if [ ! -d "android" ]; then
            echo "❌ Folder android masih tidak ada!"
            exit 1
          fi
          
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi
          
          flutter build apk --${{ github.event.inputs.build_type }}
          
          echo "=== Build done ==="

      - name: Check APK Output
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Mencari APK ==="
          APK_FOUND=$(find . -name "*.apk" -type f | head -n 1)
          
          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK TIDAK DITEMUKAN!"
            find . -type d -name "outputs" 2>/dev/null
            find . -type d -name "flutter-apk" 2>/dev/null
            exit 1
          fi
          
          echo "✅ APK found: $APK_FOUND"
          ls -lh "$APK_FOUND"
          
          APK_REL=$(echo "$APK_FOUND" | sed "s|^\./||")
          echo "APK_REL_PATH=$APK_REL" >> $GITHUB_ENV
          echo "APK_FULL_PATH=$(pwd)/$APK_REL" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_FULL_PATH }}
          retention-days: 1
          if-no-files-found: error