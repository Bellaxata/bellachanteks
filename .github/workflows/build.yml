name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Final URL: %{url_effective} ===\n"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip
          echo ""
          echo "=== File Type ==="
          file project.zip
          echo ""
          echo "=== First Bytes ==="
          xxd project.zip | head -2

      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "File bukan ZIP valid!"
            echo ""
            echo "=== Isi file ==="
            cat project.zip
            exit 1
          fi
          echo "ZIP valid"

          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Mengunci Project Dir ==="
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          else
            echo "[RESULT_ANALYZE]"
            echo "pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 1

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            timeout 120s flutter pub get || echo "Lanjut..."
          fi

      - name: Inject ProGuard Protection
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "PROGUARD PROTECTION INJECTOR AKTIF"
          echo ""

          if [ ! -f "pubspec.yaml" ]; then
            echo "Bukan project Flutter, skip ProGuard."
            exit 0
          fi

          ANDROID_APP=""
          for CANDIDATE in "android/app" "app"; do
            if [ -d "$CANDIDATE" ]; then
              ANDROID_APP="$CANDIDATE"
              break
            fi
          done

          if [ -z "$ANDROID_APP" ]; then
            ANDROID_APP=$(find . -type d -path "*/android/app" -not -path "*/build/*" | head -n 1)
          fi

          if [ -z "$ANDROID_APP" ] || [ ! -d "$ANDROID_APP" ]; then
            echo "Folder android/app tidak ditemukan, skip ProGuard."
            exit 0
          fi

          echo "Android app dir: $ANDROID_APP"
          echo ""

          PROGUARD_FILE="$ANDROID_APP/proguard-rules.pro"

          cat > "$PROGUARD_FILE" << 'PROGUARD_EOF'
          -keep class io.flutter.** { *; }
          -keep class io.flutter.plugins.** { *; }
          -keep class io.flutter.plugin.** { *; }
          -keep class io.flutter.embedding.** { *; }
          -keepattributes Signature
          -keepattributes *Annotation*
          -keepattributes InnerClasses
          -keepattributes EnclosingMethod
          -keepattributes SourceFile,LineNumberTable
          -renamesourcefileattribute SourceFile
          -keep class androidx.webkit.** { *; }
          -keep class android.webkit.** { *; }
          -keepclassmembers class * extends android.webkit.WebViewClient { *; }
          -keepclassmembers class * extends android.webkit.WebChromeClient { *; }
          -keep class com.google.android.gms.** { *; }
          -dontwarn com.google.android.gms.**
          -keep class dev.fluttercommunity.plus.connectivity.** { *; }
          -keep class androidx.lifecycle.** { *; }
          -keep class * extends androidx.lifecycle.LifecycleObserver { *; }
          -keep class * extends androidx.lifecycle.ViewModel { *; }
          -keep class androidx.core.** { *; }
          -keep class androidx.annotation.** { *; }
          -keep class kotlin.** { *; }
          -keep class kotlinx.coroutines.** { *; }
          -dontwarn kotlin.**
          -dontwarn kotlinx.**
          -keepclasseswithmembernames class * { native <methods>; }
          -keep class * implements android.os.Parcelable {
              public static final android.os.Parcelable$Creator *;
          }
          -keepclassmembers enum * {
              public static **[] values();
              public static ** valueOf(java.lang.String);
          }
          -dontwarn io.flutter.**
          -dontwarn androidx.**
          -dontwarn org.jetbrains.**
          -dontwarn javax.annotation.**
          PROGUARD_EOF

          sed -i 's/^          //' "$PROGUARD_FILE"

          echo "proguard-rules.pro dibuat ($(wc -l < "$PROGUARD_FILE") baris)"
          echo ""

          GRADLE_FILE=""
          IS_KTS=false

          if [ -f "$ANDROID_APP/build.gradle.kts" ]; then
            GRADLE_FILE="$ANDROID_APP/build.gradle.kts"
            IS_KTS=true
          elif [ -f "$ANDROID_APP/build.gradle" ]; then
            GRADLE_FILE="$ANDROID_APP/build.gradle"
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "build.gradle tidak ditemukan, skip."
            exit 0
          fi

          echo "Editing: $GRADLE_FILE (kts=$IS_KTS)"
          export GRADLE_FILE
          export IS_KTS

          python3 << 'PYEOF'
import re, os, sys

gradle_file = os.environ.get("GRADLE_FILE")
is_kts = os.environ.get("IS_KTS", "false").lower() == "true"

if not gradle_file or not os.path.exists(gradle_file):
    print("Gradle file tidak ada, skip.")
    sys.exit(0)

with open(gradle_file, "r", encoding="utf-8") as f:
    content = f.read()

if is_kts:
    inject = """
            isMinifyEnabled = true
            isShrinkResources = true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
"""
else:
    inject = """
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
"""

pattern = re.compile(
    r"(buildTypess*{[sS]*?releases*{)([sS]*?)(
s*})",
    re.MULTILINE
)

match = pattern.search(content)

if match:
    start, body, end = match.group(1), match.group(2), match.group(3)

    if is_kts:
        body = re.sub(r"s*isMinifyEnableds*=s*w+", "", body)
        body = re.sub(r"s*isShrinkResourcess*=s*w+", "", body)
        body = re.sub(r"s*proguardFiless*([sS]*?)", "", body)
    else:
        body = re.sub(r"s*minifyEnableds+w+", "", body)
        body = re.sub(r"s*shrinkResourcess+w+", "", body)
        body = re.sub(r"s*proguardFiles[sS]*?(?=
s*w|
s*})", "", body)

    new_content = content[:match.start()] + start + inject + body + end + content[match.end():]

    with open(gradle_file, "w", encoding="utf-8") as f:
        f.write(new_content)

    print("build.gradle berhasil di-inject ProGuard!")
else:
    print("buildTypes/release tidak ditemukan, coba fallback...")

    android_pattern = re.compile(r"(androids*{)", re.MULTILINE)
    if android_pattern.search(content):
        if is_kts:
            new_block = """
    buildTypes {
        release {
            isMinifyEnabled = true
            isShrinkResources = true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
"""
        else:
            new_block = """
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
"""
        new_content = android_pattern.sub(r"\1" + new_block, content, count=1)

        with open(gradle_file, "w", encoding="utf-8") as f:
            f.write(new_content)

        print("Fallback: buildTypes ditambahkan manual")
    else:
        print("Blok android{} tidak ditemukan, gagal inject.")
PYEOF

          echo ""
          echo "=== VERIFIKASI build.gradle ==="
          grep -A 8 "release {" "$GRADLE_FILE" | head -n 15
          echo ""
          echo "PROGUARD PROTECTION AKTIF!"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "=== Build APK (dengan ProGuard protection) ==="
            flutter clean
            flutter build apk --${{ github.event.inputs.build_type }}

            echo ""
            echo "=== Cek mapping.txt ==="
            MAPPING=$(find . -name "mapping.txt" -path "*release*" 2>/dev/null | head -n 1)
            if [ -n "$MAPPING" ]; then
              echo "ProGuard mapping.txt: $MAPPING"
              echo "PROGUARD_MAPPING=$MAPPING" >> $GITHUB_ENV
            else
              echo "mapping.txt tidak ditemukan."
            fi
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR" && chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug
            else
              ./gradlew assembleRelease
            fi
          fi

      - name: Check APK Output
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error

      - name: Upload ProGuard Mapping File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping-${{ github.event.inputs.tag }}
          path: |
            ${{ env.PROJECT_DIR }}/**/mapping.txt
            ${{ env.PROJECT_DIR }}/**/seeds.txt
            ${{ env.PROJECT_DIR }}/**/usage.txt
          retention-days: 30
          if-no-files-found: ignore