name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
      obfuscate_so:
        description: "Protect URL (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n"

          ls -lh project.zip
          file project.zip

      - name: Extract ZIP
        run: |
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "File bukan ZIP valid!"
            exit 1
          fi
          unzip -q project.zip -d project_raw

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # ═══════════════════════════════════════════════════════════════════════
      # PROTECT URL — Encrypt URL di Dart Source sebelum compile
      # ═══════════════════════════════════════════════════════════════════════
      - name: Protect URL in Dart Source
        if: ${{ github.event.inputs.obfuscate_so == 'true' }}
        run: |
          echo "=== INSTALLING PROTECTION ==="
          cat > protect-dart.js << 'PROTECT_SCRIPT'
          const fs = require("fs");
          const path = require("path");

          // Regex cari URL di dalam string quotes
          const URL_REGEX = /(["'])(https?:\/\/[^\s"'<>\\]+?|wss?:\/\/[^\s"'<>\\]+?|ftps?:\/\/[^\s"'<>\\]+?)\1/g;

          function encryptUrl(url) {
            const key = 0xA7;
            const buf = Buffer.from(url, "utf8");
            const xored = Buffer.alloc(buf.length);
            for (let i = 0; i < buf.length; i++) {
              xored[i] = buf[i] ^ key;
            }
            // URL-safe base64
            const b64 = xored.toString("base64")
              .replace(/\+/g, "-")
              .replace(/\//g, "_")
              .replace(/=+$/, "");
            return "XTRX::" + b64;
          }

          function encryptDartFile(filePath) {
            let content = fs.readFileSync(filePath, "utf8");
            let changed = false;
            const foundUrls = [];

            content = content.replace(URL_REGEX, (match, quote, url) => {
              if (url.startsWith("XTRX::")) return match;
              const encrypted = encryptUrl(url);
              foundUrls.push(url);
              changed = true;
              return quote + encrypted + quote;
            });

            if (changed) {
              // Inject import helper
              const importLine = "import 'xtrx_decrypt.dart';";
              if (!content.includes("xtrx_decrypt.dart")) {
                const importRegex = /^import\s+.*?;$/m;
                if (importRegex.test(content)) {
                  content = content.replace(importRegex, (m) => m + "\n" + importLine);
                } else {
                  content = importLine + "\n" + content;
                }
              }
              fs.writeFileSync(filePath, content, "utf8");
            }

            return { changed, urls: foundUrls };
          }

          function walkDir(dir, results) {
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            for (const entry of entries) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (["build", ".dart_tool", ".git", ".idea", "android", "ios", "linux", "macos", "windows", "web", ".vscode"].includes(entry.name)) continue;
                walkDir(fullPath, results);
              } else if (entry.isFile() && entry.name.endsWith(".dart")) {
                results.push(fullPath);
              }
            }
          }

          const projectDir = process.argv[2];
          const libDir = path.join(projectDir, "lib");

          if (!fs.existsSync(libDir)) {
            console.log("[PROTECT] Tidak ada folder lib/, skip");
            process.exit(0);
          }

          const dartFiles = [];
          walkDir(libDir, dartFiles);

          let totalFiles = dartFiles.length;
          let encryptedFiles = 0;
          let totalUrls = 0;

          for (const file of dartFiles) {
            try {
              const result = encryptDartFile(file);
              if (result.changed) {
                encryptedFiles++;
                totalUrls += result.urls.length;
              }
            } catch (e) {
              console.log("[PROTECT] Error " + file + ": " + e.message);
            }
          }

          // Buat file decrypt helper di lib/
          const decryptHelper = `// Auto-generated XTRX Decrypt Helper
const int _XTRX_KEY = 0xA7;
const String _XTRX_PREFIX = "XTRX::";

String xtrxDecrypt(String encrypted) {
  if (!encrypted.startsWith(_XTRX_PREFIX)) return encrypted;
  String b64 = encrypted.substring(_XTRX_PREFIX.length);
  // Restore URL-safe
  b64 = b64.replaceAll("-", "+").replaceAll("_", "/");
  while (b64.length % 4 != 0) b64 += "=";
  List<int> bytes;
  try { bytes = _base64Decode(b64); } catch (e) { return encrypted; }
  for (int i = 0; i < bytes.length; i++) bytes[i] = bytes[i] ^ _XTRX_KEY;
  return String.fromCharCodes(bytes);
}

String x(String encrypted) => xtrxDecrypt(encrypted);

const String _b64chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";

List<int> _base64Decode(String input) {
  final result = <int>[];
  final buffer = <int>[];
  for (int i = 0; i < input.length; i++) {
    final c = input[i];
    if (c == '=') break;
    final idx = _b64chars.indexOf(c);
    if (idx < 0) continue;
    buffer.add(idx);
    if (buffer.length == 4) {
      result.add((buffer[0] << 2) | (buffer[1] >> 4));
      result.add(((buffer[1] & 0xF) << 4) | (buffer[2] >> 2));
      result.add(((buffer[2] & 0x3) << 6) | buffer[3]);
      buffer.clear();
    }
  }
  if (buffer.length == 2) {
    result.add((buffer[0] << 2) | (buffer[1] >> 4));
  } else if (buffer.length == 3) {
    result.add((buffer[0] << 2) | (buffer[1] >> 4));
    result.add(((buffer[1] & 0xF) << 4) | (buffer[2] >> 2));
  }
  return result;
}
`;

          fs.writeFileSync(path.join(libDir, "xtrx_decrypt.dart"), decryptHelper, "utf8");

          console.log("[PROTECT] Encrypted " + encryptedFiles + "/" + totalFiles + " files, " + totalUrls + " URLs");
          PROTECT_SCRIPT

          node protect-dart.js "$PROJECT_DIR"
          echo "=== Protection done ==="

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          else
            echo "[RESULT_ANALYZE]"
            echo "pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 1

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            timeout 120s flutter pub get || echo "Lanjut..."
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter build apk --${{ github.event.inputs.build_type }}
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR" && chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug
            else
              ./gradlew assembleRelease
            fi
          fi

      - name: Check APK Output
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error