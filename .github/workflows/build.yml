name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
      obfuscate_so:
        description: "Amankan APK (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip
          ls -lh project.zip

      - name: Extract ZIP
        run: |
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            exit 1
          fi
          unzip -q project.zip -d project_raw

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo ""
          echo "=== ISI PROJECT ==="
          ls -la "$PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      # ═══════════════════════════════════════════════════════════════════════
      # VALIDASI & REGENERATE ANDROID FOLDER
      # ═══════════════════════════════════════════════════════════════════════
      - name: Validate & Regenerate Android Folder
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== VALIDASI PROJECT ==="

          if [ ! -f "pubspec.yaml" ]; then
            echo "❌ ERROR: pubspec.yaml tidak ditemukan!"
            echo ""
            echo "Isi folder project:"
            ls -la
            echo ""
            echo "Project harus punya pubspec.yaml di root!"
            exit 1
          fi

          echo "✅ pubspec.yaml ditemukan"
          echo ""
          echo "=== STRUKTUR PROJECT ==="
          ls -la

          # Cek folder android
          if [ ! -d "android" ]; then
            echo ""
            echo "⚠️ Folder android/ tidak ada — regenerate..."
            flutter create --platforms=android .
            echo "✅ Folder android/ berhasil dibuat"
          elif [ ! -f "android/gradlew" ]; then
            echo ""
            echo "⚠️ File android/gradlew tidak ada — regenerate..."
            rm -rf android/
            flutter create --platforms=android .
            echo "✅ Folder android/ berhasil di-regenerate"
          else
            echo "✅ Folder android/ + gradlew valid"
          fi

      # ═══════════════════════════════════════════════════════════════════════
      # AMANKAN APK — ProGuard + Anti-Debug
      # ═══════════════════════════════════════════════════════════════════════
      - name: Setup ProGuard
        if: ${{ github.event.inputs.obfuscate_so == 'true' }}
        run: |
          echo "=== [1/3] SETUP PROGUARD ==="

          GRADLE_FILE="$PROJECT_DIR/android/app/build.gradle"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="$PROJECT_DIR/android/app/build.gradle.kts"
          fi

          if [ -f "$GRADLE_FILE" ]; then
            echo "Found: $GRADLE_FILE"

            if grep -q "minifyEnabled" "$GRADLE_FILE"; then
              sed -i 's/minifyEnabled[[:space:]]*false/minifyEnabled true/g' "$GRADLE_FILE"
              sed -i 's/isMinifyEnabled[[:space:]]*false/isMinifyEnabled true/g' "$GRADLE_FILE"
            else
              sed -i '/release {/a\            minifyEnabled true\n            shrinkResources true' "$GRADLE_FILE"
            fi

            echo "✅ ProGuard enabled"
          else
            echo "⚠️ Gradle file tidak ditemukan"
          fi

          PROGUARD_FILE="$PROJECT_DIR/android/app/proguard-rules.pro"
          if [ ! -f "$PROGUARD_FILE" ]; then
            cat > "$PROGUARD_FILE" << 'PROGUARD'
# Flutter keep rules
-keep class io.flutter.** { *; }
-keep class io.flutter.plugins.** { *; }

# Obfuscation
-repackageclasses ''
-allowaccessmodification
-dontwarn
-optimizationpasses 5

# Remove logs
-assumenosideeffects class android.util.Log {
  public static *** d(...);
  public static *** v(...);
  public static *** i(...);
}
PROGUARD
            echo "✅ proguard-rules.pro created"
          fi

      - name: Setup Anti-Debug Manifest
        if: ${{ github.event.inputs.obfuscate_so == 'true' }}
        run: |
          echo "=== [2/3] SETUP ANTI-DEBUG MANIFEST ==="

          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:debuggable="true"/android:debuggable="false"/g' "$MANIFEST"
            sed -i 's/android:usesCleartextTraffic="true"/android:usesCleartextTraffic="false"/g' "$MANIFEST"
            echo "✅ Anti-debug applied"
          else
            echo "⚠️ Manifest tidak ditemukan"
          fi

      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          else
            echo "[RESULT_ANALYZE]"
            echo "pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 1

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "=== flutter pub get ==="
            timeout 180s flutter pub get || echo "⚠️ pub get timeout, lanjut..."
          fi

      # ═══════════════════════════════════════════════════════════════════════
      # BUILD APK — SELALU PAKAI flutter build
      # ═══════════════════════════════════════════════════════════════════════
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== BUILD APK ==="
          echo "Mode: ${{ github.event.inputs.build_type }}"
          echo "Protect: ${{ github.event.inputs.obfuscate_so }}"

          if [ "${{ github.event.inputs.obfuscate_so }}" = "true" ]; then
            echo "🔒 Building with OBFUSCATION + ProGuard..."
            flutter build apk --${{ github.event.inputs.build_type }} --obfuscate --split-debug-info=./build/debug_info
          else
            echo "🚀 Building normally..."
            flutter build apk --${{ github.event.inputs.build_type }}
          fi

      - name: Re-Sign APK
        if: ${{ github.event.inputs.obfuscate_so == 'true' }}
        run: |
          echo "=== [3/3] RE-SIGN APK ==="
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "APK tidak ditemukan, skip resign"
            exit 0
          fi

          echo "APK: $APK_FOUND"

          KEYSTORE="/tmp/release.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkey -v -keystore "$KEYSTORE" -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Release,O=App,C=ID" 2>/dev/null
          fi

          BT_DIR=$(ls -d $ANDROID_HOME/build-tools/*/ 2>/dev/null | sort -V | tail -n 1)
          if [ -f "${BT_DIR}zipalign" ] && [ -f "${BT_DIR}apksigner" ]; then
            "${BT_DIR}zipalign" -f 4 "$APK_FOUND" /tmp/aligned.apk
            "${BT_DIR}apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias release \
              --out "$APK_FOUND" \
              /tmp/aligned.apk
            "${BT_DIR}apksigner" verify "$APK_FOUND" || true
            rm -f /tmp/aligned.apk
            echo "✅ Re-signed"
          else
            echo "⚠️ Build tools not found, skip resign"
          fi

      - name: Check APK Output
        run: |
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK tidak ditemukan!"
            exit 1
          fi
          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          ls -lh "$APK_FOUND"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error